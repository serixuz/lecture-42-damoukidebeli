@if (open()) {
  <div class="overlay" (click)="closed.emit()"></div>
}

<aside
  class="drawer"
  [class.open]="open()"
  [attr.aria-hidden]="!open()"
  [attr.inert]="open() ? null : ''"
  aria-label="Cart"
>
  <div class="head">
    <h2 class="title">Your cart</h2>
    <button type="button" class="close" aria-label="Close cart" (click)="closed.emit()">
      &times;
    </button>
  </div>

  <div class="content">
    @for (basketItem of basketItems(); track basketItem.product.id) {
      <article class="cart-item">
        <img class="item-image" [src]="basketItem.product.image" [alt]="basketItem.product.name" />
        <div class="item-details">
          <h3 class="item-name">{{ basketItem.product.name }}</h3>
          <p class="item-price">{{ basketItem.product.price | currency:'EUR' }}</p>
          <div class="item-actions">
            <div class="quantity" role="group" [attr.aria-label]="'Quantity for ' + basketItem.product.name">
              <button type="button" aria-label="Decrease quantity" (click)="changeQuantity(basketItem, -1)">&minus;</button>
              <span aria-live="polite">{{ basketItem.quantity }}</span>
              <button type="button" aria-label="Increase quantity" (click)="changeQuantity(basketItem, 1)">+</button>
            </div>
            <button type="button" class="remove" [attr.aria-label]="'Remove ' + basketItem.product.name" (click)="removeItem(basketItem.product.id)">Remove</button>
          </div>
        </div>
      </article>
    } @empty {
      <div class="empty-cart">
        <h3>Your cart is empty</h3>
        <p class="placeholder">Add something delicious from the menu.</p>
      </div>
    }
  </div>
</aside>
